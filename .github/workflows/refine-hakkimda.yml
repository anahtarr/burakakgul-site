name: Refine Hakkimda section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-hakkimda.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refine Hakkımda layout and mobile behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old_css = """.ba-about{position:relative;z-index:3;background:#fff;color:#263238;min-height:72vh;display:flex;align-items:center;justify-content:center;padding:7rem 2rem;}
          .ba-about__inner{width:min(760px,100%);margin:0 auto;}
          .ba-about h2{margin:0 0 2rem;color:#263238;font-family:'Bellota Text',sans-serif;font-size:clamp(2.7rem,6vw,4.2rem);font-weight:400;letter-spacing:-0.14rem;line-height:1.05;}
          .ba-about p{margin:0 0 1.15rem;color:#40474b;font-family:'Open Sans',sans-serif;font-size:1.05rem;font-weight:400;line-height:1.9;letter-spacing:0;}
          .ba-about__quote{margin-top:2.35rem!important;margin-bottom:0!important;color:#263238!important;font-family:'Bellota Text',sans-serif!important;font-size:1.22rem!important;font-style:italic;line-height:1.65!important;}
          @media (max-width:736px){.ba-about{min-height:auto;padding:5rem 1.5rem;}.ba-about h2{margin-bottom:1.75rem;font-size:2.8rem;}.ba-about p{font-size:1rem;line-height:1.8;}.ba-about__quote{font-size:1.12rem!important;}}"""

          new_css = """.ba-about{position:relative;z-index:3;color:#263238;min-height:72vh;display:flex;align-items:center;justify-content:flex-start;padding:7rem clamp(3rem,8vw,9rem);background-image:url('data:image/svg+xml;charset=utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201024%201024%22%20width%3D%221024%22%20height%3D%221024%22%20preserveAspectRatio%3D%22none%22%3E%20%3Cstyle%3E%20circle%20%7B%20fill%3A%20rgba(0,0,0,0.051)%3B%20%7D%20%3C%2Fstyle%3E%20%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%225.01%25%22%20%2F%3E%20%3Ccircle%20cx%3D%22768%22%20cy%3D%22768%22%20r%3D%225.01%25%22%20%2F%3E%3C%2Fsvg%3E'),linear-gradient(0deg,#FDEBEB 0%,#FDEBEB 100%);background-size:93px,cover;background-position:center,0% 0%;background-repeat:repeat,repeat;}
          .ba-about__inner{width:min(760px,100%);margin:0;}
          .ba-about h2{margin:0 0 2rem;color:#263238;font-family:'Bellota Text',sans-serif;font-size:clamp(2.7rem,6vw,4.2rem);font-weight:400;letter-spacing:-0.14rem;line-height:1.05;text-align:left;}
          .ba-about p{margin:0 0 1.15rem;color:#40474b;font-family:'Open Sans',sans-serif;font-size:1.05rem;font-weight:400;line-height:1.9;letter-spacing:0;text-align:left;}
          .ba-about__quote{margin-top:2.35rem!important;margin-bottom:0!important;color:#263238!important;font-family:'Bellota Text',sans-serif!important;font-size:1.22rem!important;font-style:italic;line-height:1.65!important;}
          .ba-about__nobr{display:inline-block;white-space:nowrap;}
          @media (max-width:736px){.ba-about{min-height:auto;align-items:flex-start;padding:4.5rem 1.4rem 4.75rem;}.ba-about__inner{width:100%;}.ba-about h2{margin-bottom:1.65rem;font-size:2.65rem;letter-spacing:-0.09rem;}.ba-about p{font-size:0.98rem;line-height:1.78;margin-bottom:1.05rem;}.ba-about__quote{margin-top:2rem!important;font-size:1.08rem!important;line-height:1.55!important;}}
          @media (max-width:380px){.ba-about{padding-left:1.15rem;padding-right:1.15rem;}.ba-about h2{font-size:2.45rem;}.ba-about p{font-size:0.95rem;line-height:1.74;}.ba-about__quote{font-size:1.03rem!important;}}"""

          if old_css not in html:
              raise RuntimeError('Expected current Hakkımda CSS was not found; refusing to make a broad edit.')
          html = html.replace(old_css, new_css, 1)

          old_text = 'Günlerimin bir tarafında savunma sanayi, projeler, çözülmeyi bekleyen problemler ve en zoru insanlar var :) Öteki tarafında ise şarkılar…'
          new_text = 'Günlerimin bir tarafında savunma sanayi, projeler, çözülmeyi bekleyen problemler <span class="ba-about__nobr">ve en zoru insanlar var :)</span> Öteki tarafında ise şarkılar…'
          if old_text not in html:
              raise RuntimeError('Expected Hakkımda paragraph was not found.')
          html = html.replace(old_text, new_text, 1)

          path.write_text(html, encoding='utf-8')
          print('Hakkımda layout refined.')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Hakkımda layout"
          git pull --rebase origin main
          git push origin main
