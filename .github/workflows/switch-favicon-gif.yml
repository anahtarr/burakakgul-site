name: Switch favicon to GIF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch favicon link
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<link rel="icon" type="image/svg+xml" href="/favicon.svg">'
          new = '<link rel="icon" type="image/gif" href="/favicon.gif">'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit change if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use Google-compatible BA favicon"
          git push
