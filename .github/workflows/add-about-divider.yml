name: Add Hakkimda divider

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-about-divider.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add symmetric divider above Hakkımda
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if 'ba-about-divider' in html:
              print('Divider already present; no change needed.')
              raise SystemExit(0)

          css_anchor = ".ba-about__nobr{display:inline-block;white-space:nowrap;}"
          divider_css = """.ba-about-divider{position:relative;z-index:3;width:100%;height:1.5rem;margin:0;padding:0;background-color:#FDEBEB;background-size:auto 62.6%;background-image:url('data:image/svg+xml;charset=utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20x%3D%220px%22%20y%3D%220px%22%20viewBox%3D%220%200%20512%20512%22%20width%3D%22512%22%20height%3D%22512%22%20preserveAspectRatio%3D%22none%22%3E%3Cstyle%3Epath%20%7Bfill%3A%20none%3Bstroke-width%3A%201px%3Bstroke%3A%20rgba(0,0,0,0.212)%3Bstroke-linecap%3Around%3Bvector-effect%3A%20non-scaling-stroke%3B%7D%3C%2Fstyle%3E%3Cpath%20d%3D%22M-8%2C400l264-288%20M520%2C400L256%2C112%22%20%2F%3E%3C%2Fsvg%3E');background-position:center center;background-repeat:repeat-x;}"""
          if css_anchor not in html:
              raise RuntimeError('Expected Hakkımda CSS anchor not found; refusing broad edit.')
          html = html.replace(css_anchor, css_anchor + '\n' + divider_css, 1)

          marker = '<!-- HAKKIMDA-SECTION -->'
          if marker not in html:
              raise RuntimeError('Hakkımda marker not found.')
          html = html.replace(marker, '<div class="ba-about-divider" aria-hidden="true"></div>\n' + marker, 1)

          path.write_text(html, encoding='utf-8')
          print('Symmetric divider added immediately above Hakkımda.')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add divider above Hakkımda"
          git pull --rebase origin main
          git push origin main
