name: Split Hakkimda yurek sentence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-hakkimda-yurek.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Split only the final Hakkımda sentence into a new paragraph
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old = '<p>İkisi birbirinden uzak görünse de bana pek öyle gelmiyor; çünkü ne bir işi hakkıyla yapmak ne de bir şarkıyı gerçekten söylemek, sevmeden mümkün. İkisi de önce sevgi, sonra gayret, en sonunda biraz da yürek gerektiriyor.</p>'
          new = '<p>İkisi birbirinden uzak görünse de bana pek öyle gelmiyor; çünkü ne bir işi hakkıyla yapmak ne de bir şarkıyı gerçekten söylemek, sevmeden mümkün.</p>\n    <p>İkisi de önce sevgi, sonra gayret, en sonunda biraz da yürek gerektiriyor.</p>'

          if old not in html:
              raise RuntimeError('Expected Hakkımda paragraph not found; refusing to change anything else.')

          html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')
          print('Sentence moved to its own paragraph. No other content changed.')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Split Hakkımda closing sentence"
          git pull --rebase origin main
          git push origin main
