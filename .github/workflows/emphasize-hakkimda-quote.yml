name: Emphasize Hakkimda quote

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emphasize-hakkimda-quote.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Slightly enlarge and bold Hakkımda quote
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old = ".ba-about__quote{margin-top:1.1rem!important;margin-bottom:0!important;color:#263238!important;font-family:'Open Sans',sans-serif!important;font-size:1.05rem!important;font-style:italic;line-height:1.65!important;}"
          new = ".ba-about__quote{margin-top:1.1rem!important;margin-bottom:0!important;color:#263238!important;font-family:'Open Sans',sans-serif!important;font-size:1.12rem!important;font-style:italic;font-weight:700!important;line-height:1.65!important;}"
          if old not in html:
              raise RuntimeError('Expected desktop quote CSS not found; refusing broad edit.')
          html = html.replace(old, new, 1)

          old_mobile = ".ba-about__quote{margin-top:0.9rem!important;font-size:0.98rem!important;line-height:1.55!important;}"
          new_mobile = ".ba-about__quote{margin-top:0.9rem!important;font-size:1.04rem!important;line-height:1.55!important;}"
          if old_mobile not in html:
              raise RuntimeError('Expected mobile quote CSS not found.')
          html = html.replace(old_mobile, new_mobile, 1)

          old_small = ".ba-about__quote{font-size:0.95rem!important;}"
          new_small = ".ba-about__quote{font-size:1rem!important;}"
          if old_small not in html:
              raise RuntimeError('Expected small-mobile quote CSS not found.')
          html = html.replace(old_small, new_small, 1)

          path.write_text(html, encoding='utf-8')
          print('Quote slightly enlarged and bolded. No other changes made.')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Emphasize Hakkımda quote"
          git pull --rebase origin main
          git push origin main
