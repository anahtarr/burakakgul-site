name: One-time site cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply four requested fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          # 1) Remove old Carrd demo dependencies from the source.
          old_bg = "url('https://101635b64df228b0.demo.carrd.co/assets/images/bg.jpg?v=2e2cf4b4')"
          if old_bg not in html:
              raise RuntimeError('Expected Carrd demo background URL not found')
          html = html.replace(old_bg, "url('images/profilfoto.jpg')", 1)

          old_script = '<script data-cfasync="false" src="https://101635b64df228b0.demo.carrd.co/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>'
          if old_script not in html:
              raise RuntimeError('Expected Carrd email-decode script not found')
          html = html.replace(old_script, '', 1)

          # 2) Let the desktop Hakkımda section end with its content instead of forcing 72vh.
          old_height = 'min-height:72vh;display:flex;'
          if old_height not in html:
              raise RuntimeError('Expected Hakkımda desktop min-height not found')
          html = html.replace(old_height, 'min-height:auto;display:flex;', 1)

          index.write_text(html, encoding='utf-8')

          # 3) Make /favicon.ico resolve to the valid GIF favicon.
          netlify = Path('netlify.toml')
          conf = netlify.read_text(encoding='utf-8')
          old_redirect = 'from = "/favicon.ico"\n  to = "/favicon.svg"\n  status = 200'
          if old_redirect not in conf:
              raise RuntimeError('Expected favicon redirect not found')
          conf = conf.replace(old_redirect, 'from = "/favicon.ico"\n  to = "/favicon.gif"\n  status = 200', 1)
          netlify.write_text(conf, encoding='utf-8')

          # 4) Repository hygiene.
          ignore = Path('.gitignore')
          existing = ignore.read_text(encoding='utf-8') if ignore.exists() else ''
          lines = [line.rstrip('\n') for line in existing.splitlines()]
          if '.DS_Store' not in lines:
              if existing and not existing.endswith('\n'):
                  existing += '\n'
              existing += '.DS_Store\n'
          ignore.write_text(existing, encoding='utf-8')
          PY

          rm -f .DS_Store favicon.ico

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html netlify.toml .gitignore .DS_Store favicon.ico
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Clean up site dependencies and layout"
          git pull --rebase origin main
          git push origin main
