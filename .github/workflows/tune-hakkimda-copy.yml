name: Tune Hakkimda copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-hakkimda-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Adjust Hakkımda line break and quote styling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old = '<span class="ba-about__nobr">ve en zoru insanlar var :)</span> Öteki tarafında ise şarkılar… Türk Sanat Müziği ve Türk Halk Müziği korolarında solist ve korist olarak şarkı söylüyorum.</p>'
          new = '<span class="ba-about__nobr">ve en zoru insanlar var :)</span> Öteki tarafında ise şarkılar…</p>\n    <p>Türk Sanat Müziği ve Türk Halk Müziği korolarında solist ve korist olarak şarkı söylüyorum.</p>'
          if old not in html:
              raise RuntimeError('Expected music paragraph not found; refusing broad edit.')
          html = html.replace(old, new, 1)

          old_quote = ".ba-about__quote{margin-top:2.35rem!important;margin-bottom:0!important;color:#263238!important;font-family:'Bellota Text',sans-serif!important;font-size:1.22rem!important;font-style:italic;line-height:1.65!important;}"
          new_quote = ".ba-about__quote{margin-top:1.1rem!important;margin-bottom:0!important;color:#263238!important;font-family:'Open Sans',sans-serif!important;font-size:1.05rem!important;font-style:italic;line-height:1.65!important;}"
          if old_quote not in html:
              raise RuntimeError('Expected quote CSS not found; refusing broad edit.')
          html = html.replace(old_quote, new_quote, 1)

          old_mobile = ".ba-about__quote{margin-top:2rem!important;font-size:1.08rem!important;line-height:1.55!important;}"
          new_mobile = ".ba-about__quote{margin-top:0.9rem!important;font-size:0.98rem!important;line-height:1.55!important;}"
          if old_mobile not in html:
              raise RuntimeError('Expected mobile quote CSS not found.')
          html = html.replace(old_mobile, new_mobile, 1)

          old_small = ".ba-about__quote{font-size:1.03rem!important;}"
          new_small = ".ba-about__quote{font-size:0.95rem!important;}"
          if old_small not in html:
              raise RuntimeError('Expected small-mobile quote CSS not found.')
          html = html.replace(old_small, new_small, 1)

          path.write_text(html, encoding='utf-8')
          print('Hakkımda copy and quote styling updated.')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tune Hakkımda copy and quote"
          git pull --rebase origin main
          git push origin main
