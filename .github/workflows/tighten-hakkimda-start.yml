name: Tighten Hakkimda start

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tighten-hakkimda-start.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move Hakkımda content closer to first screen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old_desktop = ".ba-about{position:relative;z-index:3;color:#263238;min-height:72vh;display:flex;align-items:center;justify-content:flex-start;padding:7rem clamp(3rem,8vw,9rem);background-image:"
          new_desktop = ".ba-about{position:relative;z-index:3;color:#263238;min-height:72vh;display:flex;align-items:flex-start;justify-content:flex-start;padding:2.35rem clamp(3rem,8vw,9rem) 6rem;box-shadow:inset 0 1.25rem 1.8rem -1.7rem rgba(38,50,56,0.055);background-image:"
          if old_desktop not in html:
              raise RuntimeError('Expected desktop Hakkımda CSS not found; refusing broad edit.')
          html = html.replace(old_desktop, new_desktop, 1)

          old_mobile = "@media (max-width:736px){.ba-about{min-height:auto;align-items:flex-start;padding:4.5rem 1.4rem 4.75rem;}"
          new_mobile = "@media (max-width:736px){.ba-about{min-height:auto;align-items:flex-start;padding:2.1rem 1.4rem 4.5rem;}"
          if old_mobile not in html:
              raise RuntimeError('Expected mobile Hakkımda CSS not found.')
          html = html.replace(old_mobile, new_mobile, 1)

          path.write_text(html, encoding='utf-8')
          print('Hakkımda section now starts directly after the first screen with a subtle transition.')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tighten Hakkımda section start"
          git pull --rebase origin main
          git push origin main
