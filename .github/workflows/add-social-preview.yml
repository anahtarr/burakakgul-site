name: Add social preview image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Open Graph and Twitter image tags
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          og = '<meta property="og:image" content="https://burakakgul.com/images/profilfoto.jpg"/>'
          tw = '<meta name="twitter:image" content="https://burakakgul.com/images/profilfoto.jpg"/>'
          if og not in s:
              s = s.replace('<meta property="og:url" content="https://burakakgul.com/"/>', '<meta property="og:url" content="https://burakakgul.com/"/>' + og, 1)
          if tw not in s:
              s = s.replace('<meta name="twitter:description" content="Burak Akgül, Hacettepe Üniversitesi Elektrik-Elektronik Mühendisliği mezunu ve ASELSAN’da proje yöneticisidir. Türk Sanat Müziği ve Türk Halk Müziği korolarında solist olarak yer almaktadır."/>', '<meta name="twitter:description" content="Burak Akgül, Hacettepe Üniversitesi Elektrik-Elektronik Mühendisliği mezunu ve ASELSAN’da proje yöneticisidir. Türk Sanat Müziği ve Türk Halk Müziği korolarında solist olarak yer almaktadır."/>' + tw, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit change if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add social preview image metadata"
          git push
