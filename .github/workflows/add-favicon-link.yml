name: Add favicon link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add favicon link if missing
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="icon" type="image/svg+xml" href="/favicon.svg">'
          if marker not in s:
              s = s.replace('<head>', '<head>\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit change if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link BA favicon in page head"
          git push
