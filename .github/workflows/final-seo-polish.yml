name: Final SEO polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Update metadata and generate assets
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          root = Path('.')
          index = root / 'index.html'
          s = index.read_text(encoding='utf-8')

          # Site name metadata
          if 'property="og:site_name"' not in s:
              s = s.replace('<meta property="og:type" content="website"/>', '<meta property="og:type" content="website"/><meta property="og:site_name" content="Burak Akgül"/>', 1)

          # Social image metadata
          s = s.replace('https://burakakgul.com/images/profilfoto.jpg', 'https://burakakgul.com/images/social-preview.png', 2)
          s = s.replace('<meta name="twitter:card" content="summary"/>', '<meta name="twitter:card" content="summary_large_image"/>', 1)

          # Apple touch icon
          apple = '<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">'
          if apple not in s:
              s = s.replace('<link rel="icon" type="image/gif" href="/favicon.gif">', '<link rel="icon" type="image/gif" href="/favicon.gif">\n' + apple, 1)

          # WebSite alternateName
          marker = '"@type": "WebSite"'
          if marker in s and '"alternateName": "burakakgul.com"' not in s:
              start = s.index(marker)
              pos = s.find('"name": "Burak Akgül",', start)
              if pos != -1:
                  end = pos + len('"name": "Burak Akgül",')
                  s = s[:end] + '\n  "alternateName": "burakakgul.com",' + s[end:]

          index.write_text(s, encoding='utf-8')

          # Sitemap lastmod
          sitemap = root / 'sitemap.xml'
          sm = sitemap.read_text(encoding='utf-8')
          import re
          sm = re.sub(r'<lastmod>[^<]+</lastmod>', '<lastmod>2026-09-07</lastmod>', sm, count=1)
          sitemap.write_text(sm, encoding='utf-8')

          # Fonts
          def font(size, bold=False):
              candidates = [
                  '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
                  '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf'
              ]
              for p in candidates:
                  if Path(p).exists():
                      return ImageFont.truetype(p, size)
              return ImageFont.load_default()

          blush = '#FDEBEB'
          charcoal = '#263238'
          white = '#FFFFFF'

          # Apple touch icon 180x180, matching selected BA favicon
          icon = Image.new('RGB', (180, 180), blush)
          d = ImageDraw.Draw(icon)
          f = font(78, True)
          bbox = d.textbbox((0,0), 'BA', font=f)
          tw, th = bbox[2]-bbox[0], bbox[3]-bbox[1]
          d.text(((180-tw)/2, (180-th)/2-5), 'BA', font=f, fill=charcoal)
          icon.save('apple-touch-icon.png', optimize=True)

          # Social preview 1200x630
          W, H = 1200, 630
          canvas = Image.new('RGB', (W,H), blush)
          draw = ImageDraw.Draw(canvas)

          # right-side profile photo crop
          photo_path = root / 'images' / 'profilfoto.jpg'
          photo = Image.open(photo_path).convert('RGB')
          target_w = 430
          target_h = H
          photo = ImageOps.fit(photo, (target_w, target_h), method=Image.Resampling.LANCZOS, centering=(0.5, 0.32))
          canvas.paste(photo, (W-target_w, 0))

          # subtle divider
          draw.rectangle((W-target_w-4, 0, W-target_w, H), fill=charcoal)

          # BA mark
          mark_x, mark_y, mark_s = 70, 70, 112
          draw.rounded_rectangle((mark_x, mark_y, mark_x+mark_s, mark_y+mark_s), radius=22, fill=white)
          fmark = font(48, True)
          bb = draw.textbbox((0,0), 'BA', font=fmark)
          m_tw, m_th = bb[2]-bb[0], bb[3]-bb[1]
          draw.text((mark_x+(mark_s-m_tw)/2, mark_y+(mark_s-m_th)/2-3), 'BA', font=fmark, fill=charcoal)

          # Text
          title_f = font(58, True)
          role_f = font(31, False)
          site_f = font(23, False)
          draw.text((70, 245), 'Burak Akgül', font=title_f, fill=charcoal)
          draw.text((70, 335), 'Elektronik Mühendisi &', font=role_f, fill=charcoal)
          draw.text((70, 378), 'Proje Yöneticisi', font=role_f, fill=charcoal)
          draw.text((70, 505), 'burakakgul.com', font=site_f, fill=charcoal)

          out = root / 'images' / 'social-preview.png'
          canvas.save(out, optimize=True)
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html sitemap.xml apple-touch-icon.png images/social-preview.png; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml apple-touch-icon.png images/social-preview.png
          git commit -m "Polish SEO metadata and social assets"
          git push
