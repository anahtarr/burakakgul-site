name: Add WebSite schema

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add WebSite structured data
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '"@type": "WebSite"'
          block = '''<script type="application/ld+json">\n{\n  "@context": "https://schema.org",\n  "@type": "WebSite",\n  "@id": "https://burakakgul.com/#website",\n  "url": "https://burakakgul.com/",\n  "name": "Burak Akgül",\n  "publisher": {\n    "@id": "https://burakakgul.com/#person"\n  }\n}\n</script>\n'''
          if marker not in s:
              s = s.replace('</head>', block + '</head>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit change if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add WebSite structured data"
          git push
