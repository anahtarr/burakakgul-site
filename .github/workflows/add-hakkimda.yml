name: Add Hakkimda section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-hakkimda.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Hakkımda section without changing the existing first screen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = '<!-- HAKKIMDA-SECTION -->'
          if marker in html:
              print('Hakkımda section already exists; no change needed.')
              raise SystemExit(0)

          css = r'''
          <style id="hakkimda-style">
          .ba-about{position:relative;z-index:3;background:#fff;color:#263238;min-height:72vh;display:flex;align-items:center;justify-content:center;padding:7rem 2rem;}
          .ba-about__inner{width:min(760px,100%);margin:0 auto;}
          .ba-about h2{margin:0 0 2rem;color:#263238;font-family:'Bellota Text',sans-serif;font-size:clamp(2.7rem,6vw,4.2rem);font-weight:400;letter-spacing:-0.14rem;line-height:1.05;}
          .ba-about p{margin:0 0 1.15rem;color:#40474b;font-family:'Open Sans',sans-serif;font-size:1.05rem;font-weight:400;line-height:1.9;letter-spacing:0;}
          .ba-about__quote{margin-top:2.35rem!important;margin-bottom:0!important;color:#263238!important;font-family:'Bellota Text',sans-serif!important;font-size:1.22rem!important;font-style:italic;line-height:1.65!important;}
          @media (max-width:736px){.ba-about{min-height:auto;padding:5rem 1.5rem;}.ba-about h2{margin-bottom:1.75rem;font-size:2.8rem;}.ba-about p{font-size:1rem;line-height:1.8;}.ba-about__quote{font-size:1.12rem!important;}}
          </style>
          '''

          section = r'''
          <!-- HAKKIMDA-SECTION -->
          <section id="hakkimda" class="ba-about" aria-labelledby="hakkimda-baslik">
            <div class="ba-about__inner">
              <h2 id="hakkimda-baslik">Hakkımda</h2>
              <p>Hayatımın büyük kısmı merak etmekle geçti. Bir şeyin nasıl çalıştığını anlamak, bozulanı düzeltmek, yeni bir çözüm bulmak hep hoşuma gitti. Belki bu yüzden mühendis oldum; belki de mühendis olduğum için hâlâ her şeyi kurcalıyorum.</p>
              <p>Günlerimin bir tarafında savunma sanayi, projeler, çözülmeyi bekleyen problemler ve en zoru insanlar var :) Öteki tarafında ise şarkılar… Türk Sanat Müziği ve Türk Halk Müziği korolarında solist ve korist olarak şarkı söylüyorum.</p>
              <p>İkisi birbirinden uzak görünse de bana pek öyle gelmiyor; çünkü ne bir işi hakkıyla yapmak ne de bir şarkıyı gerçekten söylemek, sevmeden mümkün. İkisi de önce sevgi, sonra gayret, en sonunda biraz da yürek gerektiriyor.</p>
              <p>Bu siteyi kendimi uzun uzun anlatmak için değil, yol boyunca ilgimi çeken şeylerden bana dair küçük izler bırakmak için hazırladım. Çünkü,</p>
              <p class="ba-about__quote">“Ömür çiçek kadar narin, bir gün kadar kısa.”</p>
            </div>
          </section>
          '''

          if '</head>' not in html or '</body>' not in html:
              raise RuntimeError('Expected closing head/body tags were not found.')

          html = html.replace('</head>', css + '\n</head>', 1)
          html = html.replace('</body>', section + '\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          print('Hakkımda section added.')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Hakkımda section"
          git pull --rebase origin main
          git push origin main
